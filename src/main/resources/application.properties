spring.application.name=javabank
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---- Database (set these in .env locally, or as platform env vars when deploying) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bankSystem?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# ---- SMTP for OTP emails (leave MAIL_HOST empty to print emails in the console) ----
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail-from=${MAIL_FROM:${MAIL_USER:noreply@javabank.local}}
app.mail-from-name=${MAIL_FROM_NAME:JavaBank}
app.session-minutes=20

# ---- Bank rules ----
app.otp-threshold=${OTP_THRESHOLD:10000}
app.loan-rate=10
app.interest-rate=3.5
app.admin-card=${ADMIN_CARD:1000000000000000}
app.admin-pin=${ADMIN_PIN:}
