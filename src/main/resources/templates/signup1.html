<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign up - Page 1')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container py-4" style="max-width:720px">
<div th:replace="~{fragments :: flash}"></div>
<h4>Page 1: Personal details</h4><div class="progress mb-3"><div class="progress-bar" style="width:33%"></div></div>
<form th:action="@{/signup/1}" method="post" class="row g-3">
  <div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="name" required></div>
  <div class="col-md-6"><label class="form-label">Father name</label><input class="form-control" name="fatherName"></div>
  <div class="col-md-6"><label class="form-label">Date of birth</label><input class="form-control" type="date" name="dob" required></div>
  <div class="col-md-6"><label class="form-label d-block">Gender</label>
    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" value="Male" checked> <label class="form-check-label">Male</label></div>
    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" value="Female"> <label class="form-check-label">Female</label></div>
    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" value="Other"> <label class="form-check-label">Other</label></div></div>
  <div class="col-md-6"><label class="form-label">Email (OTPs are sent here)</label><input class="form-control" type="email" name="email" required></div>
  <div class="col-md-6"><label class="form-label">Marital status</label><select class="form-select" name="marital"><option>Single</option><option>Married</option><option>Other</option></select></div>
  <div class="col-12"><label class="form-label">Address</label><input class="form-control" name="address" required></div>
  <div class="col-md-4"><label class="form-label">City</label><input class="form-control" name="city" required></div>
  <div class="col-md-4"><label class="form-label">State</label><input class="form-control" name="state" required></div>
  <div class="col-md-4"><label class="form-label">Pincode</label><input class="form-control" name="pincode" maxlength="6" inputmode="numeric" required></div>
  <div class="col-12 d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/login}">Cancel</a><button class="btn btn-primary" th:text="#{common.next}">Next</button></div>
</form>
<script th:replace="~{fragments :: prefill}"></script>
</div>
<div th:replace="~{fragments :: live}"></div>
</body>
</html>
