<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Scheduled transfers')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container py-4" style="max-width:820px">
<div th:replace="~{fragments :: flash}"></div>
<h3 th:text="'⏰ ' + #{nav.scheduled}">Scheduled</h3>
<p class="text-muted">Recurring monthly transfers (rent, savings, EMI). They run automatically every day at 06:00 IST on the chosen day.</p>
<form th:action="@{/scheduled}" method="post" class="row g-2 mb-4">
  <div class="col-md-4"><input class="form-control" name="to" placeholder="To account number" inputmode="numeric" required></div>
  <div class="col-md-3"><input class="form-control" name="amount" type="number" step="0.01" min="1" placeholder="Amount" required></div>
  <div class="col-md-3"><input class="form-control" name="day" type="number" min="1" max="28" placeholder="Day of month (1-28)" required></div>
  <div class="col-md-2"><button class="btn btn-primary w-100" th:text="#{common.add}">Add</button></div>
</form>
<table class="table bg-white"><thead><tr><th>To account</th><th>Amount</th><th>Day</th><th>Last run</th><th></th></tr></thead><tbody>
  <tr th:each="o : ${items}"><td th:text="${o.toAccount}"></td><td th:text="${o.amount}"></td><td th:text="${o.dayOfMonth}"></td><td th:text="${o.lastRun}"></td>
    <td class="text-end"><form th:action="@{/scheduled/{id}/delete(id=${o.id})}" method="post"><button class="btn btn-sm btn-outline-danger" th:text="#{common.delete}">Delete</button></form></td></tr>
  <tr th:if="${#lists.isEmpty(items)}"><td colspan="5" class="text-muted">Nothing scheduled</td></tr>
</tbody></table>
</div>
<div th:replace="~{fragments :: live}"></div>
</body>
</html>
