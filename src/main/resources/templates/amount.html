<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${title})}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container py-4" style="max-width:520px">
<div th:replace="~{fragments :: flash}"></div>
<h3 th:text="${title}"></h3>
<form th:action="@{${action}}" method="post" class="card card-body shadow-sm">
  <label class="form-label" th:text="#{common.amount}">Amount</label>
  <input class="form-control form-control-lg mb-3" name="amount" type="number" step="0.01" min="1" required autofocus>
  <button class="btn btn-primary w-100" th:text="#{common.submit}">Submit</button>
  <div class="form-text mt-2" th:if="${title == 'Withdraw'}">Withdrawals of Rs. 10,000 or more (or unusual activity) need an email OTP. Your daily limit: Rs. <span th:text="${me.dailyLimit}"></span></div>
</form>
</div>
<div th:replace="~{fragments :: live}"></div>
</body>
</html>
