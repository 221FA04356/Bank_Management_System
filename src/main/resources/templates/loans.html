<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Loans')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container py-4" style="max-width:860px">
<div th:replace="~{fragments :: flash}"></div>
<h3 th:text="'🏠 ' + #{nav.loans}">Loans</h3>
<div class="row g-3 mb-4">
  <div class="col-md-6"><div class="card card-body shadow-sm">
    <h5>EMI calculator</h5>
    <p class="text-muted small">Interest rate: <span th:text="${rate}"></span>% per year</p>
    <input class="form-control mb-2" id="p" type="number" min="1000" placeholder="Loan amount" oninput="calc()">
    <input class="form-control mb-2" id="n" type="number" min="3" max="60" placeholder="Months (3-60)" oninput="calc()">
    <div>Monthly EMI: <b id="emi">-</b></div>
  </div></div>
  <div class="col-md-6"><div class="card card-body shadow-sm">
    <h5>Apply for a loan</h5>
    <form th:action="@{/loans}" method="post">
      <input class="form-control mb-2" name="amount" type="number" step="0.01" min="1000" max="1000000" placeholder="Amount (max 10,00,000)" required>
      <input class="form-control mb-2" name="months" type="number" min="3" max="60" placeholder="Tenure in months" required>
      <button class="btn btn-primary w-100">Apply</button>
    </form>
  </div></div>
</div>
<div id="live"><table class="table bg-white"><thead><tr><th>#</th><th>Amount</th><th>Months</th><th>EMI</th><th>Status</th><th>Applied</th></tr></thead><tbody>
  <tr th:each="l : ${loans}"><td th:text="${l.id}"></td><td th:text="${l.principal}"></td><td th:text="${l.months}"></td><td th:text="${l.emi}"></td>
    <td><span class="badge" th:classappend="${l.status == 'APPROVED'} ? 'text-bg-success' : (${l.status == 'REJECTED'} ? 'text-bg-danger' : 'text-bg-warning')" th:text="${l.status}"></span></td>
    <td th:text="${#temporals.format(l.createdAt,'dd MMM yyyy')}"></td></tr>
  <tr th:if="${#lists.isEmpty(loans)}"><td colspan="6" class="text-muted">No loan applications</td></tr>
</tbody></table></div>
<script th:inline="javascript">
const rate = /*[[${rate}]]*/ 10;
function calc(){
  const p=+document.getElementById('p').value, n=+document.getElementById('n').value, r=rate/1200;
  const e = r ? p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1) : p/n;
  document.getElementById('emi').textContent = isFinite(e) && p>0 && n>0 ? 'Rs. '+e.toFixed(2) : '-';
}
</script>
</div>
<div th:replace="~{fragments :: live}"></div>
</body>
</html>
