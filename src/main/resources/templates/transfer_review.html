<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Confirm transfer')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container py-4" style="max-width:560px">
<div th:replace="~{fragments :: flash}"></div>
<h3>Review and confirm</h3>
<th:block th:replace="~{fragments :: countdown(${left})}"></th:block>
<div class="card card-body shadow-sm">
  <label class="form-label">To account number (locked)</label>
  <input class="form-control mb-3" th:value="${d.to}" disabled readonly>
  <div class="mb-2">Account holder: <b th:text="${d.name}"></b></div>
  <div class="mb-2">Amount: <b th:text="'Rs. ' + ${d.amount}"></b></div>
  <div class="mb-3">Type: <b th:text="${d.channel}"></b></div>
  <div class="d-flex gap-2">
    <a class="btn btn-outline-secondary" th:href="${d.requestId != null} ? @{/requests} : @{/transfer(back=1)}">← Back</a>
    <form th:action="@{/transfer/confirm}" method="post" class="m-0"><button class="btn btn-primary">Confirm transfer</button></form>
  </div>
  <div class="form-text mt-2">If the amount is Rs. 10,000 or more, or looks unusual, an OTP is emailed to you next.</div>
</div>
</div>
<div th:replace="~{fragments :: live}"></div>
</body>
</html>
