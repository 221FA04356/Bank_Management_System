<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Statement')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container py-4" style="max-width:960px">
<div th:replace="~{fragments :: flash}"></div>
<h3 th:text="'📄 ' + #{nav.statement}">Statement</h3>
<form method="get" th:action="@{/statement}" class="row g-2 mb-3">
  <div class="col-md-3"><input class="form-control" type="date" name="from" th:value="${from}"></div>
  <div class="col-md-3"><input class="form-control" type="date" name="to" th:value="${to}"></div>
  <div class="col-auto"><button class="btn btn-primary">Show</button></div>
  <div class="col-auto"><a class="btn btn-danger" th:href="@{/statement/pdf(from=${from},to=${to})}">⬇ Download PDF</a></div>
</form>
<div id="live"><div th:replace="~{fragments :: txns(${list})}"></div></div>
</div>
<div th:replace="~{fragments :: live}"></div>
</body>
</html>
