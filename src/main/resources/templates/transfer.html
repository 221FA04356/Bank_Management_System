<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Transfer')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container py-4" style="max-width:560px">
<div th:replace="~{fragments :: flash}"></div>
<h3 th:text="'🔁 ' + #{nav.transfer}">Transfer</h3>
<form th:action="@{/transfer/review}" method="post" class="card card-body shadow-sm">
  <div class="mb-3" th:if="${!#lists.isEmpty(bens)}">
    <label class="form-label">Pick a saved beneficiary</label>
    <select class="form-select" onchange="if(this.value)document.getElementById('to').value=this.value">
      <option value="">-- choose --</option>
      <option th:each="b : ${bens}" th:value="${b.accountNumber}" th:text="${b.name} + ' (' + ${b.accountNumber} + ')'"></option>
    </select>
  </div>
  <label class="form-label">Beneficiary account number</label>
  <input class="form-control mb-3" id="to" name="to" th:value="${to}" inputmode="numeric" required>
  <label class="form-label" th:text="#{common.amount}">Amount</label>
  <input class="form-control mb-3" name="amount" type="number" step="0.01" min="1" th:value="${amt}" required>
  <button class="btn btn-primary">Review transfer →</button>
  <div class="form-text mt-2">You will confirm the details on the next step. Transfers of Rs. 10,000 or more need an email OTP. <a th:href="@{/beneficiaries}">Manage beneficiaries</a></div>
</form>
</div>
<div th:replace="~{fragments :: live}"></div>
</body>
</html>
